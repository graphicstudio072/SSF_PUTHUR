# Render Blueprint for SSF Puthur Sector MERN Application
# Docs: https://render.com/docs/blueprint-spec

services:
  # ==========================================
  # 1. Backend Web Service (Node.js API)
  # ==========================================
  - type: web
    name: ssf-puthur-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PIN
        value: 7860
      - key: CLIENT_URL
        value: https://ssf-puthur-client.onrender.com

  # ==========================================
  # 2. Frontend Static Site (React + Vite)
  # ==========================================
  - type: web
    name: ssf-puthur-client
    runtime: static
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      # SPA rewrite rule so React Router routes like /admin work on refresh
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: ssf-puthur-server
          property: host
        value: https://ssf-puthur-server.onrender.com/api
